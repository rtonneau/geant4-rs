[workspace]
resolver = "3"
members = [
    "crates/g4-core",
    "crates/g4-data",
    "crates/g4-physics",
    "crates/g4-chemistry",
    "crates/g4-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false

[workspace.dependencies]
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
serde_json = "1"
approx = "0.5"
proptest = "1"
rayon = "1"
sha2 = "0.10"

# Table parsing and SHA-256 in tests run on 7 MB of data: keep debug builds usable.
[profile.dev.package.g4-core]
opt-level = 1
[profile.dev.package.g4-data]
opt-level = 1
[profile.dev.package.g4-physics]
opt-level = 1
[profile.dev.package.g4-chemistry]
opt-level = 1
[profile.dev.package.g4-sim]
opt-level = 1

# The M2 acceptance tests transport 10^4 electrons of up to 1 MeV (about 10^8 interactions):
# optimise test builds (debug assertions stay on).
[profile.test]
opt-level = 3
