[workspace]
resolver = "3"
members = ["crates/dna-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
serde_json = "1"
approx = "0.5"
proptest = "1"
rayon = "1"

# Table parsing and SHA-256 in tests run on 7 MB of data: keep debug builds usable.
[profile.dev.package.dna-core]
opt-level = 1
