# RR-009 finite-volume boundary reference (validation/geant4/RUN_REQUESTS.md, README "RR-009 finite-volume boundary").
geant4_version = "11.4.3"
geant4_version_number = 1143
geant4_install = "G4_ROOT = geant4-v11.4.3-install (Qt6 from vcpkg)"
geant4_source_revision = "v11.4.3 release source; local source directory has no git metadata"
g4emlow_version = "8.8"
g4emlow_md5 = "328330009df633f7e9b3a9f445745298"
physics_constructor = "G4EmDNAPhysics_option2"
chemistry_constructor = "G4EmDNAChemistry_option3"
timestep_model = "IRT"
fluo_auger = false
mode = "finite_volume"
snapshots = ["1ps (first non-zero chemistry time step)", "end (EndProcessing at end_time_ps)"]
end_time_ps = 1.0e6
primary = "e-, origin, isotropic (G4RandomDirection), one per event"
energies_eV = [1000, 10000, 100000]
histories_per_energy = 10000
working_directory = "validation/geant4/g4rs_ref"
commands = [
  "g4rs_ref finite_volume ../../reference/rr009_sphere_100nm 2026111301 sphere 100 1000:10000,10000:10000,100000:10000",
  "g4rs_ref finite_volume ../../reference/rr009_sphere_1000nm 2026111302 sphere 1000 1000:10000,10000:10000,100000:10000",
  "g4rs_ref finite_volume ../../reference/rr009_sphere_10000nm 2026111303 sphere 10000 1000:10000,10000:10000,100000:10000",
  "g4rs_ref finite_volume ../../reference/rr009_box_1000x1000x100nm 2026111304 box 1000,1000,100 1000:10000,10000:10000,100000:10000",
]
seeds = [2026111301, 2026111302, 2026111303, 2026111304]
execution_note = "Run in parallel (4 processes, exit 0 each, 97 min wall for the slowest) from the registered working directory with build-1143/g4rs_ref.exe on PATH; output prefixes pointed to a scratch directory, files copied unchanged afterwards. Registered commands differ only in output path."
validation = "each run: 3 'finite_volume: <E> eV done (10000 events)' lines; 30000 history rows; max |edep+escaped-E0|/E0 <= 5.7e-14"
known_header_issue = "CSV header line reports 'events 0' although every energy ran its 10000 events (cosmetic generator label; data rows are complete)"
date = "2026-11-13"
generator_commit = "789fc469d1d7e22561d0e7c2b994bfacb9ed145c"
generator_dirty = false
data_commit = "aca59478d19199875d6c901bd7dce3362f6fb0b5"
