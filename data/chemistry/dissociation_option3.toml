# Decay channels of the excited / ionised / attached water molecule and of the recombined H2Ovib (option3 chemistry).
# Source: G4ChemDissociationChannels_option1.cc ("CH"), ConstructDissociationChannels, lines 194-466. Each state is
# registered by the `NewConfigurationWithElectronOccupancy` call at the line given (its channels are defined just
# above it and attached just below it; H2Ovib channels are attached at CH:462-465).
#
# Mapping from the physical stage (G4DNAChemistryManager::CreateWaterMolecule, utils/src/G4DNAChemistryManager.cc:600-660, state changes at :634, :637, :640):
#   excitation level k  -> ExciteMolecule(4 - k): orbit 4-k emptied, orbit 5 filled
#   ionisation shell s  -> IonizeMolecule(4 - s): orbit 4-s emptied
#   attachment          -> AddElectron(5, 1)
# `orbit_vacated` below is that orbit; the Rust loader checks orbit_vacated == 4 - index.
#
# Channel selection (G4DNAMolecularDissociation::DecayIt, processes/src/G4DNAMolecularDissociation.cc:142-153): one uniform
# number u; channels are scanned in the order of this file, `u < p` selects, otherwise `u -= p`.
# `decay_energy_ev` is the energy booked as local deposit by the *chemistry-stage* decay (DecayIt: ProposeLocalEnergyDeposit);
# it is NOT part of the physical-stage energy ledger (docs/01 A.4, docs/09 Q20).
# displacement: "none" for channels without products (relax) and the case of G4DNAWaterDissociationDisplacer otherwise.

[[state]]
name = "A^1B_1"
kind = "excitation"
index = 0
orbit_vacated = 4
cpp_line = 240

[[state.channel]]
